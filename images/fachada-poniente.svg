<svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid-p" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" stroke="#C4B5A0" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>
  <!-- Paper background -->
  <rect width="800" height="550" fill="#F5F0E8"/>
  <!-- Grid overlay -->
  <rect width="800" height="550" fill="url(#grid-p)" opacity="0.4"/>
  <!-- Title block -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#8B8178" letter-spacing="4">FACHADA PONIENTE</text>
  <line x1="280" y1="42" x2="520" y2="42" stroke="#C4B5A0" stroke-width="0.5"/>
  <!-- Ground line -->
  <line x1="60" y1="440" x2="740" y2="440" stroke="#8B8178" stroke-width="1"/>
  <line x1="40" y1="442" x2="760" y2="442" stroke="#8B8178" stroke-width="0.5"/>
  <!-- Stepped volumes - characteristic Barragán composition -->
  <!-- Lower left volume -->
  <rect x="100" y="260" width="180" height="180" fill="none" stroke="#5a5248" stroke-width="1.2"/>
  <rect x="100" y="260" width="180" height="180" fill="#D4C5B0" opacity="0.2"/>
  <!-- Upper left step -->
  <rect x="100" y="160" width="120" height="100" fill="none" stroke="#5a5248" stroke-width="1.2"/>
  <rect x="100" y="160" width="120" height="100" fill="#C4B5A0" opacity="0.15"/>
  <!-- Central volume -->
  <rect x="280" y="200" width="160" height="240" fill="none" stroke="#5a5248" stroke-width="1.2"/>
  <rect x="280" y="200" width="160" height="240" fill="#BEB0A0" opacity="0.15"/>
  <!-- Tall chimney / vertical element -->
  <rect x="460" y="60" width="42" height="380" fill="none" stroke="#5a5248" stroke-width="1.2"/>
  <rect x="460" y="60" width="42" height="380" fill="#A09888" opacity="0.15"/>
  <!-- Right lower volume -->
  <rect x="502" y="280" width="130" height="160" fill="none" stroke="#5a5248" stroke-width="1.2"/>
  <rect x="502" y="280" width="130" height="160" fill="#D4C5B0" opacity="0.18"/>
  <!-- Far right step -->
  <rect x="632" y="330" width="80" height="110" fill="none" stroke="#5a5248" stroke-width="1.2"/>
  <rect x="632" y="330" width="80" height="110" fill="#C4B5A0" opacity="0.12"/>
  <!-- Window/door openings - hatched -->
  <g fill="#6B6560" opacity="0.25">
    <rect x="140" y="310" width="90" height="130"/>
    <rect x="310" y="250" width="50" height="65"/>
    <rect x="380" y="340" width="40" height="100"/>
    <rect x="530" y="330" width="60" height="80"/>
  </g>
  <!-- Window frames -->
  <g fill="none" stroke="#5a5248" stroke-width="0.8">
    <rect x="140" y="310" width="90" height="130"/>
    <rect x="310" y="250" width="50" height="65"/>
    <rect x="380" y="340" width="40" height="100"/>
    <rect x="530" y="330" width="60" height="80"/>
  </g>
  <!-- Cross-hatching in windows -->
  <g stroke="#5a5248" stroke-width="0.3" opacity="0.4">
    <line x1="140" y1="310" x2="230" y2="440"/>
    <line x1="230" y1="310" x2="140" y2="440"/>
    <line x1="310" y1="250" x2="360" y2="315"/>
    <line x1="360" y1="250" x2="310" y2="315"/>
    <line x1="380" y1="340" x2="420" y2="440"/>
    <line x1="420" y1="340" x2="380" y2="440"/>
  </g>
  <!-- Dimension lines -->
  <g stroke="#C4B5A0" stroke-width="0.5">
    <line x1="100" y1="470" x2="712" y2="470"/>
    <line x1="100" y1="465" x2="100" y2="475"/>
    <line x1="712" y1="465" x2="712" y2="475"/>
    <!-- Vertical -->
    <line x1="70" y1="60" x2="70" y2="440"/>
    <line x1="65" y1="60" x2="75" y2="60"/>
    <line x1="65" y1="440" x2="75" y2="440"/>
  </g>
  <!-- Scale -->
  <text x="400" y="490" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#8B8178">ESC. 1:50</text>
  <!-- Dedication -->
  <text x="650" y="510" text-anchor="end" font-family="Georgia, serif" font-size="9" fill="#8B8178" font-style="italic" opacity="0.6">Para Baby Meyer de Garate</text>
  <text x="650" y="525" text-anchor="end" font-family="Georgia, serif" font-size="8" fill="#8B8178" opacity="0.4">con todo cariño — L.B.</text>
  <!-- North arrow -->
  <g transform="translate(720, 80)">
    <line x1="0" y1="20" x2="0" y2="-20" stroke="#8B8178" stroke-width="0.8"/>
    <polygon points="0,-20 -5,-10 5,-10" fill="#8B8178" opacity="0.6"/>
    <text x="0" y="-25" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#8B8178">N</text>
  </g>
</svg>
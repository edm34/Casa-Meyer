<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="light-beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF7F2" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FAF7F2" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FAF7F2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pink-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E84C8A"/>
      <stop offset="100%" stop-color="#D43A78"/>
    </linearGradient>
  </defs>
  <!-- Pink wall background -->
  <rect width="600" height="600" fill="url(#pink-wall)"/>
  <!-- Lattice grid - 6x8 pattern -->
  <g>
    <!-- Horizontal bars -->
    <rect x="60" y="50" width="480" height="12" fill="#C83A6E"/>
    <rect x="60" y="115" width="480" height="12" fill="#C83A6E"/>
    <rect x="60" y="180" width="480" height="12" fill="#C83A6E"/>
    <rect x="60" y="245" width="480" height="12" fill="#C83A6E"/>
    <rect x="60" y="310" width="480" height="12" fill="#C83A6E"/>
    <rect x="60" y="375" width="480" height="12" fill="#C83A6E"/>
    <rect x="60" y="440" width="480" height="12" fill="#C83A6E"/>
    <rect x="60" y="505" width="480" height="12" fill="#C83A6E"/>
    <!-- Vertical bars -->
    <rect x="60" y="50" width="12" height="467" fill="#C83A6E"/>
    <rect x="140" y="50" width="12" height="467" fill="#C83A6E"/>
    <rect x="220" y="50" width="12" height="467" fill="#C83A6E"/>
    <rect x="300" y="50" width="12" height="467" fill="#C83A6E"/>
    <rect x="380" y="50" width="12" height="467" fill="#C83A6E"/>
    <rect x="460" y="50" width="12" height="467" fill="#C83A6E"/>
    <rect x="528" y="50" width="12" height="467" fill="#C83A6E"/>
  </g>
  <!-- Light passing through the lattice cells -->
  <g opacity="0.35">
    <!-- Row 1 -->
    <rect x="72" y="62" width="68" height="53" fill="#FAF7F2" opacity="0.2"/>
    <rect x="152" y="62" width="68" height="53" fill="#FAF7F2" opacity="0.35"/>
    <rect x="232" y="62" width="68" height="53" fill="#FAF7F2" opacity="0.5"/>
    <rect x="312" y="62" width="68" height="53" fill="#FAF7F2" opacity="0.4"/>
    <rect x="392" y="62" width="68" height="53" fill="#FAF7F2" opacity="0.25"/>
    <rect x="472" y="62" width="56" height="53" fill="#FAF7F2" opacity="0.15"/>
    <!-- Row 2 -->
    <rect x="72" y="127" width="68" height="53" fill="#FAF7F2" opacity="0.15"/>
    <rect x="152" y="127" width="68" height="53" fill="#FAF7F2" opacity="0.3"/>
    <rect x="232" y="127" width="68" height="53" fill="#FAF7F2" opacity="0.55"/>
    <rect x="312" y="127" width="68" height="53" fill="#FAF7F2" opacity="0.6"/>
    <rect x="392" y="127" width="68" height="53" fill="#FAF7F2" opacity="0.35"/>
    <rect x="472" y="127" width="56" height="53" fill="#FAF7F2" opacity="0.2"/>
    <!-- Row 3 -->
    <rect x="72" y="192" width="68" height="53" fill="#FAF7F2" opacity="0.1"/>
    <rect x="152" y="192" width="68" height="53" fill="#FAF7F2" opacity="0.25"/>
    <rect x="232" y="192" width="68" height="53" fill="#FAF7F2" opacity="0.5"/>
    <rect x="312" y="192" width="68" height="53" fill="#FAF7F2" opacity="0.65"/>
    <rect x="392" y="192" width="68" height="53" fill="#FAF7F2" opacity="0.45"/>
    <rect x="472" y="192" width="56" height="53" fill="#FAF7F2" opacity="0.25"/>
    <!-- Row 4 -->
    <rect x="72" y="257" width="68" height="53" fill="#FAF7F2" opacity="0.08"/>
    <rect x="152" y="257" width="68" height="53" fill="#FAF7F2" opacity="0.2"/>
    <rect x="232" y="257" width="68" height="53" fill="#FAF7F2" opacity="0.4"/>
    <rect x="312" y="257" width="68" height="53" fill="#FAF7F2" opacity="0.55"/>
    <rect x="392" y="257" width="68" height="53" fill="#FAF7F2" opacity="0.5"/>
    <rect x="472" y="257" width="56" height="53" fill="#FAF7F2" opacity="0.3"/>
    <!-- Row 5 -->
    <rect x="72" y="322" width="68" height="53" fill="#FAF7F2" opacity="0.05"/>
    <rect x="152" y="322" width="68" height="53" fill="#FAF7F2" opacity="0.15"/>
    <rect x="232" y="322" width="68" height="53" fill="#FAF7F2" opacity="0.3"/>
    <rect x="312" y="322" width="68" height="53" fill="#FAF7F2" opacity="0.45"/>
    <rect x="392" y="322" width="68" height="53" fill="#FAF7F2" opacity="0.5"/>
    <rect x="472" y="322" width="56" height="53" fill="#FAF7F2" opacity="0.35"/>
    <!-- Row 6 -->
    <rect x="72" y="387" width="68" height="53" fill="#FAF7F2" opacity="0.03"/>
    <rect x="152" y="387" width="68" height="53" fill="#FAF7F2" opacity="0.1"/>
    <rect x="232" y="387" width="68" height="53" fill="#FAF7F2" opacity="0.2"/>
    <rect x="312" y="387" width="68" height="53" fill="#FAF7F2" opacity="0.35"/>
    <rect x="392" y="387" width="68" height="53" fill="#FAF7F2" opacity="0.45"/>
    <rect x="472" y="387" width="56" height="53" fill="#FAF7F2" opacity="0.35"/>
    <!-- Row 7 -->
    <rect x="72" y="452" width="68" height="53" fill="#FAF7F2" opacity="0.02"/>
    <rect x="152" y="452" width="68" height="53" fill="#FAF7F2" opacity="0.08"/>
    <rect x="232" y="452" width="68" height="53" fill="#FAF7F2" opacity="0.15"/>
    <rect x="312" y="452" width="68" height="53" fill="#FAF7F2" opacity="0.25"/>
    <rect x="392" y="452" width="68" height="53" fill="#FAF7F2" opacity="0.35"/>
    <rect x="472" y="452" width="56" height="53" fill="#FAF7F2" opacity="0.3"/>
  </g>
  <!-- Diagonal light beam effect -->
  <polygon points="200,0 600,0 600,400" fill="url(#light-beam)" opacity="0.15"/>
  <!-- Shadow on floor from lattice -->
  <g opacity="0.12" transform="skewX(-15)">
    <rect x="150" y="530" width="60" height="8" fill="#2C2C2C"/>
    <rect x="230" y="530" width="60" height="8" fill="#2C2C2C"/>
    <rect x="310" y="530" width="60" height="8" fill="#2C2C2C"/>
    <rect x="390" y="530" width="60" height="8" fill="#2C2C2C"/>
    <rect x="470" y="530" width="60" height="8" fill="#2C2C2C"/>
  </g>
</svg>